---
- name: Issue x-ui-compatible certificate and set panel certificate paths
  hosts: all
  gather_facts: true
  become: true
  vars:
    allow_x_ui_certificate_apply: false
    x_ui_domain: ""
    x_ui_issue_certificate: true
    x_ui_set_panel_certificate: true
    x_ui_binary_path: /usr/local/x-ui/x-ui
    x_ui_acme_path: /root/.acme.sh/acme.sh
    x_ui_cert_dir: "/root/cert/{{ x_ui_domain }}"
    x_ui_cert_fullchain_path: "{{ x_ui_cert_dir }}/fullchain.pem"
    x_ui_cert_key_path: "{{ x_ui_cert_dir }}/privkey.pem"
  pre_tasks:
    - name: Require an explicit single-host limit for x-ui certificate setup
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
          - ansible_play_hosts_all | length == 1
        fail_msg: "x-ui certificate setup is mutating. Run with an explicit single-host --limit standalone."

    - name: Require explicit approval and domain input
      ansible.builtin.assert:
        that:
          - allow_x_ui_certificate_apply | bool
          - x_ui_domain | length > 0
          - x_ui_domain is match('^[A-Za-z0-9.-]+$')
        fail_msg: "Set -e allow_x_ui_certificate_apply=true and -e x_ui_domain=<node-domain> after DNS and port 80 review."

    - name: Show rollout and rollback notes
      ansible.builtin.debug:
        msg:
          - "This playbook uses an x-ui-compatible ACME layout under /root/cert/<domain>/ and applies panel TLS via x-ui cert."
          - "HTTP validation requires public DNS to this host and port 80 reachable."
          - "Rollback: re-run x-ui cert with the previous fullchain/key paths or restore panel settings from backup."

  tasks:
    - name: Check x-ui binary exists
      ansible.builtin.stat:
        path: "{{ x_ui_binary_path }}"
      register: x_ui_binary

    - name: Require installed x-ui binary
      ansible.builtin.assert:
        that:
          - x_ui_binary.stat.exists
        fail_msg: "3x-ui is not installed at {{ x_ui_binary_path }}. Run 3x-ui-install.yml first."

    - name: Check current certificate files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ x_ui_cert_fullchain_path }}"
        - "{{ x_ui_cert_key_path }}"
      register: x_ui_cert_files

    - name: Determine if certificate is already present
      ansible.builtin.set_fact:
        x_ui_certificate_present: "{{ x_ui_cert_files.results | map(attribute='stat.exists') | min }}"

    - name: Check public ACME HTTP port listener before standalone issue
      ansible.builtin.command: ss -H -ltn sport = :80
      register: x_ui_port_80_listener
      changed_when: false
      failed_when: false
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool

    - name: Refuse standalone ACME if port 80 is already bound
      ansible.builtin.assert:
        that:
          - x_ui_port_80_listener.stdout | length == 0
        fail_msg: "Port 80 is already listening on this host; standalone HTTP validation would be unsafe. Resolve manually before issuing."
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool

    - name: Install ACME prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - socat
        state: present
        update_cache: true
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool

    - name: Check acme.sh installation
      ansible.builtin.stat:
        path: "{{ x_ui_acme_path }}"
      register: x_ui_acme

    - name: Install acme.sh for x-ui-compatible certificate issuance
      ansible.builtin.shell:
        cmd: curl https://get.acme.sh | sh
        creates: "{{ x_ui_acme_path }}"
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool
        - not x_ui_acme.stat.exists

    - name: Set Let's Encrypt as acme.sh default CA
      ansible.builtin.command: "{{ x_ui_acme_path }} --set-default-ca --server letsencrypt --force"
      changed_when: false
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool

    - name: Issue certificate with standalone HTTP validation
      ansible.builtin.command: "{{ x_ui_acme_path }} --issue --standalone -d {{ x_ui_domain }} --httpport 80 --log --force"
      register: x_ui_acme_issue
      changed_when: true
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool

    - name: Ensure x-ui certificate directory exists
      ansible.builtin.file:
        path: "{{ x_ui_cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install certificate into x-ui certificate directory
      ansible.builtin.shell:
        cmd: >-
          {{ x_ui_acme_path }} --installcert --force -d {{ x_ui_domain }}
          --key-file {{ x_ui_cert_key_path }}
          --fullchain-file {{ x_ui_cert_fullchain_path }}
          --reloadcmd "x-ui restart"
      register: x_ui_acme_installcert
      changed_when: true
      when:
        - x_ui_issue_certificate | bool
        - not x_ui_certificate_present | bool

    - name: Verify x-ui certificate files after issue/install
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ x_ui_cert_fullchain_path }}"
        - "{{ x_ui_cert_key_path }}"
      register: x_ui_cert_verify

    - name: Require certificate files before panel TLS setup
      ansible.builtin.assert:
        that:
          - x_ui_cert_verify.results | map(attribute='stat.exists') | min
        fail_msg: "Certificate files are missing under {{ x_ui_cert_dir }}."

    - name: Set x-ui panel certificate paths
      ansible.builtin.command: "{{ x_ui_binary_path }} cert -webCert {{ x_ui_cert_fullchain_path }} -webCertKey {{ x_ui_cert_key_path }}"
      register: x_ui_panel_cert
      changed_when: true
      when:
        - x_ui_set_panel_certificate | bool

    - name: Restart x-ui after panel certificate update
      ansible.builtin.systemd_service:
        name: x-ui.service
        state: restarted
        enabled: true
      when:
        - x_ui_set_panel_certificate | bool

    - name: Verify x-ui service after certificate setup
      ansible.builtin.command: systemctl --no-pager is-active x-ui.service
      register: x_ui_service_active
      changed_when: false

    - name: Show sanitized certificate setup result
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          domain: "{{ x_ui_domain }}"
          certificate_dir: "{{ x_ui_cert_dir }}"
          panel_certificate_set: "{{ x_ui_set_panel_certificate | bool }}"
          x_ui_service_active: "{{ x_ui_service_active.stdout }}"

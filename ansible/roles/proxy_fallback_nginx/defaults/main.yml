---
proxy_fallback_listen_address: 127.0.0.1
proxy_fallback_listen_port: 8000
proxy_fallback_root: /var/www/standalone-fallback
proxy_fallback_server_name: "{{ inventory_hostname }}"
# The VPS machine ID selects one stable page. A different VPS gets a different node ID.
proxy_fallback_site_key: "{{ ansible_facts['machine_id'] | hash('sha256') }}"
proxy_fallback_site_id: "api-{{ proxy_fallback_site_key[:12] }}"
proxy_fallback_site_variants:
  - name: Northstar API
    headline: Reliable data exchange.
    description: A simple gateway for application data and service health.
    product: Data gateway
    accent: '#60a5fa'
  - name: Waypoint API
    headline: Events move forward.
    description: An endpoint for event delivery and service monitoring.
    product: Event gateway
    accent: '#34d399'
  - name: Meridian API
    headline: One place for integrations.
    description: A compact interface for connected applications and status checks.
    product: Integration gateway
    accent: '#fbbf24'
  - name: Relay API
    headline: Services stay connected.
    description: A lightweight entry point for API requests and health reporting.
    product: Service gateway
    accent: '#c4b5fd'
proxy_fallback_site_variant_index: "{{ (proxy_fallback_site_key[:8] | int(base=16)) % (proxy_fallback_site_variants | length) }}"
proxy_fallback_site_variant: "{{ proxy_fallback_site_variants[proxy_fallback_site_variant_index | int] }}"
